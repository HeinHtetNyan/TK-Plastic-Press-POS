<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/TK transparent-Photoroom.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="%VITE_APP_THEME_COLOR%" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="%VITE_APP_SHORT_NAME%" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      // Apply saved theme and text size before first paint (no flash).
      try {
        var d = document.documentElement;
        var th = localStorage.getItem('tk-theme');
        var sz = localStorage.getItem('tk-text-size');
        if (th === 'dark') d.setAttribute('data-theme', 'dark');
        if (sz === 'large') d.setAttribute('data-text-size', 'large');
        if (localStorage.getItem('lang') === 'MM') { d.classList.add('lang-mm'); d.lang = 'my'; }
      } catch (e) { /* storage unavailable */ }
    </script>
    <title>%VITE_APP_TITLE%</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.warn('Service Worker registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
